app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}

  mail:
    enabled: ${APP_MAIL_ENABLED:true}

spring:
  config:
    import: optional:file:./application-local.properties

  datasource:
    url: jdbc:postgresql://localhost:5432/loc_rdt
    username: postgres
    password: root

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQL10Dialect
    hibernate:
      ddl-auto: update

    properties:
      hibernate:
        format_sql: true
